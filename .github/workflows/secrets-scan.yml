name: Secrets Scan (TruffleHog)

# Improvement 5: Security scanning (DEC-061).
# Scans git history + working tree for committed secrets
# (API keys, tokens, passwords, private keys, etc.).

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '0 7 * * 1'  # Weekly Monday 7 AM UTC (after CodeQL)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: TruffleHog OSS Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Scan (filesystem + history)
        uses: trufflesecurity/trufflehog@v3.63.0
        with:
          path: ./
          # For PR: compare against default branch
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
          # --only-verified: only report confirmed secrets (no false positives)